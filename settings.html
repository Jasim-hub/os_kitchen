<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link
    rel="icon"
    type="image/png"
    href="logo.png"
>
<title>OS Events</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="app-shell" id="appShell"></div>

  <script src="js/supabase.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderShell('settings', 'Settings', 'Business info used on bills & PDFs');
      const s = getSettings();
      document.getElementById('pageContent').innerHTML = `
        <div class="card" style="max-width:560px;">
          <div class="card-head"><h3>Business Details</h3></div>
          <form id="settingsForm" class="card-body">
            <div class="form-group">
              <label class="f-label">Business Name</label>
              <input type="text" id="setName" value="${escapeHtml(s.businessName)}">
            </div>
            <div class="form-group">
              <label class="f-label">Address</label>
              <input type="text" id="setAddress" value="${escapeHtml(s.address)}">
            </div>
            <div class="form-group">
              <label class="f-label">Phone</label>
              <input type="text" id="setPhone" value="${escapeHtml(s.phone)}">
            </div>
            <div class="hint mt-8">This info appears on the printed bill and generated PDF header. Stored locally in this browser.</div>
            <button type="submit" class="btn btn-primary mt-16">Save Settings</button>
          </form>
        </div>

        <div class="card mt-16" style="max-width:560px;">
          <div class="card-head"><h3>Database Connection</h3></div>
          <div class="card-body">
            <p class="text-soft" style="font-size:13px;">
              Connected to: <span class="mono">${window.SUPABASE_CONFIGURED ? 'configured ✓' : 'not configured — edit js/supabase.js'}</span>
            </p>
          </div>
        </div>
      `;
      document.getElementById('settingsForm').onsubmit = (e) => {
        e.preventDefault();
        saveSettings({
          businessName: document.getElementById('setName').value.trim(),
          address: document.getElementById('setAddress').value.trim(),
          phone: document.getElementById('setPhone').value.trim(),
        });
        toast('Settings saved', 'success');
      };
    });
  </script>
</body>
</html>
